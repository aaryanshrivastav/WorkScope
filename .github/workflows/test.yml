name: LMIP Tests

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYSPARK_PYTHON: python
      PYSPARK_DRIVER_PYTHON: python    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
            distribution: temurin
            java-version: '11'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Validate Repository Structure
        run: |
          test -d notebooks
          test -d contracts
          test -d workflows
          test -d sql
          test -d docs

          echo "Repository structure valid"    
      - name: Validate Contract YAML
        run: |
          python - << 'EOF'
          import yaml
          from pathlib import Path

          for f in Path("contracts").rglob("*.yaml"):
              with open(f) as fp:
                  yaml.safe_load(fp)

          print("All contracts valid")
          EOF
      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Validate Workflow JSON
        run: |
          find workflows -name "*.json" | while read f
          do
            echo "Validating $f"
            jq empty "$f"
          done
      - name: Run unit tests
        run: |
          pytest tests/test_*.py \
          -v \
          --tb=short \
          --junitxml=pytest-report.xml \
          --cov=. \
          --cov-report=term
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: pytest-report.xml
